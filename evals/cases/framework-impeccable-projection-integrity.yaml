id: framework-impeccable-projection-integrity
description: Both installed Impeccable projections match their inventory, and offline source-archive fixtures reject malformed or changed archives without granting admission.
kind: static
tags: [agent-config, skills, framework-lock, provenance]
check: >-
  python3 -c "import importlib.util, pathlib; p = pathlib.Path('.agents/agentctl.py'); s = importlib.util.spec_from_file_location('agentctl', p); a = importlib.util.module_from_spec(s); s.loader.exec_module(a); r = pathlib.Path.cwd(); c = a.load_contract(r); d = a.load_framework_lock(r, c); assert d is not None; entries = [e for e in d['frameworks'] if e['id'] == 'impeccable']; assert len(entries) == 1; assert {'claude', 'codex'} <= entries[0]['provider_projections'].keys(); errors = a.validate_framework_lock(r, c); assert not errors, errors"
  && python3 -m unittest discover -s .agents/tests -p test_framework_provenance.py -v
  && python3 .agents/agentctl.py check .
