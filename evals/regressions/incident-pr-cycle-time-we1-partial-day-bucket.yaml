id: incident-pr-cycle-time-we1-partial-day-bucket
description: >-
  Incident ccswitch-pr-cycle-time we1 (2026-09-25): the control-band monitor
  scored the still-open UTC day as a full-day sample, so a single slow PR
  (n=1, 3.46h vs a 0.37h daily-mean baseline) breached 3σ. The control-band
  suite must carry a named partial-day test proving an in-progress or
  thinly-populated day bucket cannot fire a rule. Fails (pytest exit 5, no
  test selected) until that guard and test land.
kind: static
tags: [incident, control-band, sdlc]
check: python -m pytest -q server/tests/test_sdlc_control_bands.py -k partial_day
