# Alembic configuration for ccswitch-web
# Runtime SQLite dev path uses init_db() create_all; Alembic is for Postgres prod.

[alembic]
script_location = server/db/migrations
prepend_sys_path = .
version_path_separator = os  # Use os.pathsep

# Set the sqlalchemy.url via environment variable in env.py
# sqlalchemy.url = %(CCSWITCH_DB_URL)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
