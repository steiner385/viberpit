[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccswitch"
version = "0.1.0"
description = "Automatic Claude Max account rotation"
requires-python = ">=3.11"
dependencies = ["cryptography>=43", "claude-agent-sdk==0.2.105"]

[project.scripts]
ccswitch = "ccswitch.cli:main"
ccrun = "ccswitch.runner:main"
ccmax = "ccswitch.launcher:main"

[project.optional-dependencies]
server = [
  "itsdangerous",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "asyncpg",
    "alembic",
    "cryptography",
    "webauthn",
    "httpx",
    "pywebpush",
    "pytest",
    "pytest-asyncio",
  "pytest-cov",
    "pytest-xdist",
    "pytest-timeout",
    "hypothesis",
    "pyyaml",
    # Pin below 0.16 for reproducible CI: ruff 0.16.0 enables new lint rules
    # (RUF100/BLE001/UP041/…) that flag pre-existing server/ code, so an unpinned
    # ruff turns every PR's lint-and-test red the moment a new minor ships. Adopting
    # 0.16's rules is a deliberate, curated change — bump this pin in its own PR.
    "ruff>=0.15,<0.16",
    "mypy",
    "pydantic-settings",
]
# Server-side dictation engine (server/stt). Installed on the edge by the deploy
# controller (`.[server,stt]`); CI and runner sync keep `[server]` — tests use a fake engine.
stt = ["faster-whisper>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# The codebase deliberately uses a compact, single-line style for small
# dataclasses and wire serializers (e.g. `field: str; field2: int` and
# `def to_wire(self): return {...}`) and occasional combined imports. Ignore the
# style rules that flag that intent; keep the pyflakes correctness rules (F-codes)
# active so real dead code is still caught and fixed (constitution principle VI).
ignore = [
    "E701",  # multiple statements on one line (colon) — intentional compact defs
    "E702",  # multiple statements on one line (semicolon) — intentional
    "E401",  # multiple imports on one line — intentional
]

[tool.ruff.lint.per-file-ignores]
# Test modules import after per-test env / sys.path setup (E402) and frequently
# bind names they don't use in scaffolding such as context managers and tuple
# unpacking (F841). Neither is a defect in test code.
"**/tests/**" = ["E402", "F841"]
"tests/**" = ["E402", "F841"]

[tool.pytest.ini_options]
testpaths = ["server/tests", "tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
