# Pin the edge to the session daemon's well-known socket so it attaches in REMOTE
# mode deterministically at startup, bypassing the A2.3 auto-probe.
#
# Why: with the socket unset, the edge probes the daemon's /info with a hard 1s
# timeout and, on ANY failure, silently falls back to an in-process orchestrator.
# When the edge restarts while the daemon is busy (rehydrating sessions / spawning
# subprocesses — common during deploy churn), that probe times out and the edge
# starts a SECOND orchestrator over the SAME shared SQLite DB. Both then rehydrate
# and resume the same sessions, double-spawning claude + MCP fleets, and the edge
# serves /api/sessions from its own stale in-memory records (a session the daemon
# is actively driving shows the edge's rehydration-time "idle" → the UI renders
# "Ready" while work is happening). This split-brain caused the 2026-06-23
# "Ready while working" incident.
#
# Setting the socket explicitly removes the probe race entirely: the edge connects
# to the daemon unconditionally. Install to /etc/systemd/system/ccswitch.service.d/
# then `systemctl daemon-reload`. Remove only if the daemon is being retired.
[Service]
Environment=CCSWITCH_SESSIOND_SOCKET=/run/ccswitch/sessiond.sock
