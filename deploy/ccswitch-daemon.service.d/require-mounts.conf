# The daemon reads credentials, the shared skill set, and the archive dir through
# sshfs mounts from dobby. Starting before they exist produces confusing failures
# rather than a clean error: session creation reports accounts_need_reauth, sessions
# run with the wrong skills, and archiving fails with Permission denied.
# Bind the daemon to the mount unit so ordering is enforced by systemd, not by hand.
#
# Requires= (not Wants=) is deliberate and load-bearing: #765 was caused by the daemon
# starting into a DEAD sshfs mount and dying with
#   OSError: [Errno 5] Input/output error: '/home/tony/.claude-accounts'
# Loosening this to Wants= would trade a clean 'dependency failed' for that crash.
#
# The cost of Requires= is that a failed mount unit CANCELS this start job, and a
# cancelled start job never engages Restart=always. Two things cover that, in order:
#   1. bin-ccswitch-mounts.sh retries internally, so a tailnet still settling at boot
#      never fails the mount unit in the first place (2026-08-26 outage).
#   2. ccswitch-daemon-ensure.timer re-starts a daemon left dead by a cancelled job (#765).
#
# Install to /etc/systemd/system/ccswitch-daemon.service.d/ then `systemctl daemon-reload`.
[Unit]
Requires=ccswitch-mounts.service
After=ccswitch-mounts.service
