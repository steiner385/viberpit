# At host shutdown systemd stops units in reverse start order. Without this the
# daemon is stopped AFTER Postgres and the network are gone, so anything it does
# while stopping fails (#2806). Ordering After= makes them outlive it.
# Install to /etc/systemd/system/viberpit-daemon.service.d/ then `systemctl daemon-reload`.
[Unit]
After=postgresql.service network-online.target
