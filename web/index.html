<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Both rendered from public/brand/viberpit-mascot.png by web/scripts/gen-icons.sh. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Draw the installed app under the notch rather than letterboxing it;
         pairs with viewport-fit=cover below. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="ViberPit — multi-account AI coding-agent session manager" />
    <!-- Tint mobile browser chrome to match the app background in each scheme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16171d" />
    <!--
      interactive-widget=resizes-content: when the Android soft keyboard opens, shrink the
      *layout* viewport (so `dvh`/`vh` track the area above the keyboard) instead of the default
      `resizes-visual` (keyboard overlays, dvh stays full-height → the h-dvh column's top bar gets
      scrolled off-screen to keep the focused composer in view). Lets the SessionView flex column
      reflow: header pinned top, composer pinned just above the keyboard. Ignored where unsupported.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>ViberPit</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Portal root for Dialog/Sheet/Menu (web/src/ui). Sits outside #root so
         `inert` on #root while an overlay is open never inerts the overlay. -->
    <div id="overlays"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
