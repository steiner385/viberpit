name: E2E nightly (broad cross-browser)

# The broader half of the G14 gate (#1412). Per-PR CI (ci.yml `e2e-cross-browser`) runs
# only the representative set on Firefox and WebKit, to keep its cost bounded; this
# workflow points ALL THREE engines at the WHOLE e2e suite (`PW_BROAD=1`, see
# web/playwright.config.ts), where engine-specific regressions in the other specs
# surface without taxing every PR.
#
# It is also the sample pool for the flake budget. One PR run is a few hundred test
# runs at most; the < 1% claim needs enough of them that "0 flakes" means something
# (web/scripts/e2eFlake.mjs, MIN_RUNS_FOR_VERDICT). Each night's JSON report is kept
# 90 days so a later session can pool them:
#
#   gh run download --name e2e-nightly-reports --dir /tmp/nightly   (per run)
#   node web/scripts/check-e2e-flake.mjs --strict /tmp/nightly/**/e2e.json
#
# Schedule/dispatch only - no push or pull_request trigger - so it can never hold a
# commit's required contexts, and needs no concurrency group (server/tests/
# test_workflow_concurrency.py only constrains workflows that run on pushes/PRs).
# NOT a required check, and a red run here is information, not a merge blocker: the
# first nights are EXPECTED to surface engine gaps in specs that have only ever run
# on Chromium.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-broad:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PW_BROAD: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium firefox webkit --with-deps
      - name: Build
        run: npm run build
      - name: Broad E2E (all engines, whole suite)
        run: npx playwright test
      - name: Flake report
        if: ${{ !cancelled() }}
        run: |
          echo '### E2E nightly flake report (one night)' >> "$GITHUB_STEP_SUMMARY"
          node scripts/check-e2e-flake.mjs test-results/e2e.json | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-nightly-reports
          path: |
            web/test-results/e2e.json
            web/test-results/e2e.xml
          retention-days: 90
      - name: Upload failure evidence
        # Screenshots and traces of anything that failed or needed a retry.
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-nightly-evidence
          path: web/test-results/
          retention-days: 30
