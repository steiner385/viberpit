name: Evals

# Gate agent-configuration changes on the eval corpus (AI-Native SDLC §7, #805).
# Runs ONLY when a change touches how an agent behaves — instruction files,
# Claude/Codex control planes, repo skills, the eval corpus, or this workflow.
# gates the merge; the static evals are deterministic (no LLM / API key needed).
on:
  push:
    branches: [master]
    paths:
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".claude/**"
      - ".codex/**"
      - ".agents/skills/**"
      - "evals/**"
      - "scripts/run_evals.py"
      - "server/sdlc/evals.py"
      - ".github/workflows/evals.yml"
  pull_request:
    paths:
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".claude/**"
      - ".codex/**"
      - ".agents/skills/**"
      - "evals/**"
      - "scripts/run_evals.py"
      - "server/sdlc/evals.py"
      - ".github/workflows/evals.yml"

concurrency:
  group: evals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install deps
        run: pip install -e ".[server]"
      - name: Run eval suite (static gate, threshold 1.0)
        run: python scripts/run_evals.py --threshold 1.0
