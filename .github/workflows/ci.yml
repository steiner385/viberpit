name: CI

on:
  push:
    branches: [master]
  pull_request:

# One in-flight run per ref: a superseded PR push cancels the stale run.
# master runs are never cancelled (deploys watch them).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Which halves of the tree did this PR actually touch? The frontend job is a
  # REQUIRED check, so it must always run and report — a required check that is
  # skipped never reports at all and blocks the PR forever. It therefore stays in
  # the job list and gates its own expensive steps on `needs.changes.outputs.web`.
  # The advisory e2e/lighthouse jobs are not required, so they skip outright.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.detect.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Three-dot diff needs the merge base, which a shallow clone lacks.
          fetch-depth: 0
      - name: Detect web changes
        id: detect
        env:
          # Never interpolate ${{ }} straight into the shell: workflow expressions
          # are substituted as TEXT before bash parses the script, so a value
          # carrying quotes/`$(…)` would execute. Both are tame here (an event name
          # is a fixed enum; a base ref is a branch in THIS repo, not the fork's
          # attacker-controlled head_ref), but the env indirection costs nothing
          # and keeps the safe habit uniform across the file.
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Anything other than a PR (i.e. a push to master) always builds: the
          # e2e/lighthouse baselines and the deploy watchers expect master runs.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "not a pull_request -> web=true"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          # ci.yml itself counts as a web change so edits to THIS logic are still
          # proven against a real frontend run before they land. Fail loud rather
          # than silently skipping: an empty diff means the detection is broken
          # (wrong base, shallow clone), and defaulting to "no web changes" there
          # would green-light a REQUIRED check without running it.
          if [ -z "$changed" ]; then
            echo "::error::no changed files detected vs origin/$BASE_REF — refusing to guess"
            exit 1
          fi
          if grep -qE '^(web/|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            web=true
          else
            web=false
          fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "web=$web ($(wc -l <<<"$changed") changed files)"

  # lint-and-test used to run everything (ruff, mypy, core tests, server tests)
  # in one job. Measured on run 33938129932: server/tests/ was 648s of the
  # 742s total (87%), and the private repo's ubuntu-latest runner has only 2
  # vCPUs, so `-n auto` resolved to 2 workers, not the ~7x the old comment
  # here claimed (#1137). server-tests below shards that step across 4 jobs
  # instead (~8 effective workers); lint-and-test-core keeps the cheap ~60s of
  # ruff/mypy/core-tests. lint-and-test itself is now a thin aggregator (see
  # its comment) that preserves the required-context name.
  lint-and-test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install deps
        run: pip install -e ".[server]"
      - name: Ruff check
        run: ruff check src/ server/
      - name: Mypy
        run: mypy server/ --ignore-missing-imports
      - name: Core unit tests
        run: python -m pytest tests/ -q --junitxml=test-results/core.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-python-core
          path: test-results/*.xml
          retention-days: 30

  server-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ccswitch_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ccswitch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install deps
        run: pip install -e ".[server]"
      - name: CPU diagnostics
        # Confirms the 2-worker hypothesis in #1137 on the record, per its
        # suggested first step, each time this job runs.
        run: |
          echo "nproc: $(nproc)"
          python -c "import os; print('os.cpu_count():', os.cpu_count())"
      - name: Server tests (shard ${{ matrix.shard }}/4)
        env:
          CCSWITCH_TEST_PG_URL: postgresql+asyncpg://ccswitch_test:test@127.0.0.1:5432/ccswitch_test
        # scripts/ci_shard_tests.py buckets whole FILES (never individual
        # tests) by a hash of their path, so --dist loadfile's per-file worker
        # pinning still holds — files that share DB/Postgres state (e.g.
        # test_postgres_compat) stay serialized, now within one shard job
        # instead of within the single runner. pytest-timeout converts a hung
        # test into a NAMED failure after 300s (a bad shuffle once ate the
        # whole job budget silently and held up the deploy controller); the
        # outer `timeout` guard is the backstop.
        run: |
          files="$(python scripts/ci_shard_tests.py --shard ${{ matrix.shard }} --total 4)"
          echo "Shard ${{ matrix.shard }}/4: $files"
          # $files is a space-separated list of repo-relative paths (no spaces in
          # path names) and must word-split into separate pytest args.
          # shellcheck disable=SC2086
          timeout --signal=SIGTERM 1500 python -m pytest $files -q -n auto --dist loadfile --timeout=300 --junitxml=test-results/server-shard-${{ matrix.shard }}.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-python-server-shard-${{ matrix.shard }}
          path: test-results/*.xml
          retention-days: 30

  lint-and-test:
    # REQUIRED check: branch protection and server/deploy/steps.py:ci_verdict
    # key off a context literally named "lint-and-test". Now that the real
    # work is split across lint-and-test-core and the sharded server-tests
    # matrix, this job is a thin aggregator that owns that name and fails if
    # either failed — the same "always report the context" shape as the
    # amendment-context shim in #1127. It must run unconditionally: a skipped
    # required check wedges branch protection and the self-update preflight
    # (#1137), so `if: always()` rather than a default `needs`-gated skip.
    needs: [lint-and-test-core, server-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check shard results
        run: |
          core="${{ needs.lint-and-test-core.result }}"
          tests="${{ needs.server-tests.result }}"
          echo "lint-and-test-core: $core"
          echo "server-tests: $tests"
          if [ "$core" != "success" ] || [ "$tests" != "success" ]; then
            echo "::error::lint-and-test-core=$core server-tests=$tests"
            exit 1
          fi

  frontend:
    # REQUIRED check: always runs so it always reports. When no web/ file changed
    # every step below is a no-op and the job green-lights in ~15s instead of ~12m
    # (measured: install 1m16s + typecheck 12s + lint 29s + vitest 9m20s + build 14s).
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - if: needs.changes.outputs.web == 'true'
        uses: actions/checkout@v7
      - if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        if: needs.changes.outputs.web == 'true'
        run: npm ci
      - name: Typecheck
        if: needs.changes.outputs.web == 'true'
        run: npm run typecheck
      - name: Lint
        if: needs.changes.outputs.web == 'true'
        run: npm run lint
      - name: Unit tests
        if: needs.changes.outputs.web == 'true'
        run: npm run test -- --reporter=default --reporter=junit --outputFile=test-results/vitest.xml
      - name: Upload test results
        if: always() && needs.changes.outputs.web == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: junit-vitest
          path: web/test-results/*.xml
          retention-days: 30
      - name: Build
        if: needs.changes.outputs.web == 'true'
        run: npm run build
      - name: No web changes
        if: needs.changes.outputs.web != 'true'
        # web/ was never checked out in this branch, so the job's default
        # working-directory doesn't exist yet — run this one step at the
        # workspace root instead.
        working-directory: ${{ github.workspace }}
        run: echo "No web/ files changed — frontend checks skipped."

  e2e:
    # ADVISORY: intentionally NOT in branch-protection required checks. All 3
    # specs mock the backend via page.route, so only the built frontend runs.
    # The CI/CD Doctor tracks this job's stability and proposes graduation.
    # Not required ⇒ safe to skip the whole job when no web/ file changed.
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
      - name: Build
        run: npm run build
      - name: E2E tests
        run: npx playwright test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-e2e
          path: web/test-results/*.xml
          retention-days: 30

  lighthouse:
    # ADVISORY: intentionally NOT in branch-protection required checks. Audits the
    # built dashboard served by `vite preview` (a real production bundle, not the
    # dev server). Like the e2e job, the CI/CD Doctor tracks this job's stability
    # and proposes graduation to a required check once it's proven stable (#453).
    # Not required ⇒ safe to skip the whole job when no web/ file changed.
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lighthouse audit (vite preview)
        # Serve the built bundle and audit it in a single step so the background
        # preview server outlives the command that needs it.
        run: |
          mkdir -p test-results
          npm run preview -- --port 4173 --host 127.0.0.1 &
          preview_pid=$!
          npx --yes wait-on --timeout 60000 http://127.0.0.1:4173
          npx --yes lighthouse http://127.0.0.1:4173 \
            --output=json --output=html \
            --output-path=./test-results/lighthouse \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-gpu --disable-dev-shm-usage"
          kill "$preview_pid" 2>/dev/null || true
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: web/test-results/lighthouse*
          retention-days: 30
