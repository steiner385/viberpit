name: CI

on:
  push:
    branches: [master]
  pull_request:

# One in-flight run per ref: a superseded PR push cancels the stale run.
# master runs are never cancelled (deploys watch them).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -e ".[server]"
      - name: Ruff check
        run: ruff check src/ server/
      - name: Mypy
        run: mypy server/ --ignore-missing-imports
      - name: Core unit tests
        run: python -m unittest discover -s tests
      - name: Server tests
        run: pytest server/tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
