name: Constitution

# Enforces the Governance section on the resulting diff rather than on which tool
# or which person produced it. Method-based controls (MANAGED_DENY, the PreToolUse
# hook) cannot see a human's editor or a github.com web commit; a review-based
# control degenerates with a single maintainer, because GitHub will not let an
# author approve their own pull request. A status check has neither problem.
#
# NOTE: this workflow deliberately has NO `paths:` filter. It is a *required*
# status check, and a required check that is skipped leaves every unrelated pull
# request permanently pending. The script exits 0 in a few seconds when the diff
# touches nothing governed.

on:
  pull_request:
    # `edited` is essential and NOT in the default set (opened, synchronize,
    # reopened): the acknowledgment lives in the pull request body, so adding one
    # to a failing PR must re-run the check. Without this the only way to clear a
    # missing acknowledgment is an empty commit.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: constitution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  amendment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs against the base branch, so it needs real history.
          fetch-depth: 0
      - name: Check governance record
        # PR_BODY is passed through the environment, never interpolated into the
        # run command — a title or body is attacker-controlled text.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_constitution_amendment.py --base-ref "origin/${BASE_REF}"
