name: Constitution

# Enforces the Governance section on the resulting diff rather than on which tool
# or which person produced it. Method-based controls (MANAGED_DENY, the PreToolUse
# hook) cannot see a human's editor or a github.com web commit; a review-based
# control degenerates with a single maintainer, because GitHub will not let an
# author approve their own pull request. A status check has neither problem.
#
# NOTE: this workflow deliberately has NO `paths:` filter. It is a *required*
# status check, and a required check that is skipped leaves every unrelated pull
# request permanently pending. The script exits 0 in a few seconds when the diff
# touches nothing governed.

on:
  pull_request:
    # `edited` is essential and NOT in the default set (opened, synchronize,
    # reopened): the acknowledgment lives in the pull request body, so adding one
    # to a failing PR must re-run the check. Without this the only way to clear a
    # missing acknowledgment is an empty commit.
    types: [opened, synchronize, reopened, edited]
  # `amendment` is a REQUIRED status check, and server/deploy/steps.py:ci_verdict
  # treats a required context with no run on the commit as "pending" — not "green".
  # Without a push trigger no master commit ever carries this context, so the deploy
  # preflight wedges permanently. Enforcement still happens on the pull request; this
  # trigger exists so the context is REPORTED on master.
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # Key on the COMMIT, never on the pull request. `edited` is in the trigger list
  # above, so two events routinely fire for the SAME head sha — a push (`synchronize`)
  # immediately followed by a body edit is the normal shape of `gh pr create` plus a
  # `--body-file` update. A pull-request-scoped group put both in `constitution-<n>`
  # and `cancel-in-progress` shot the first one down mid-run, leaving a CANCELLED
  # `amendment` check-run attached to that sha. GitHub's status rollup counts
  # CANCELLED as a FAILURE, so the pull request reads permanently red while the
  # check it is red for actually passed, and branch protection — which reads only
  # the latest run per name — says CLEAN (2026-09-16, #1828).
  #
  # `pull_request.head.sha` is the commit the checks attach to; `github.sha` is the
  # synthetic merge commit, and is EMPTY of a pull request on a master push, which is
  # why it stays the fallback: without it every master push shares `constitution-`
  # and cancels its predecessor, leaving the earlier commit with no check at all.
  group: constitution-${{ github.event.pull_request.head.sha || github.sha }}
  # Never cancel. The script exits in seconds, so supersession saves nothing, and
  # every cancellation costs a commit either a red check-run (cancelled mid-run) or
  # a missing one (cancelled while pending) — both of which `ci_verdict` reads as
  # not-green.
  cancel-in-progress: false

jobs:
  amendment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs against the base branch, so it needs real history.
          fetch-depth: 0
      - name: Check governance record
        # PR_BODY is passed through the environment, never interpolated into the
        # run command — a title or body is attacker-controlled text.
        #
        # pull_request only: on push, github.base_ref is empty, so this would run
        # --base-ref "origin/", fail to diff, treat the constitution as new, find no
        # acknowledgment in an empty PR_BODY and exit 1 — turning the wedge from
        # permanent-pending into permanent-red.
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_constitution_amendment.py --base-ref "origin/${BASE_REF}"
      - name: Report required context on master
        # The acknowledgment was already enforced on the pull request that produced
        # this commit; master is a fast-forward of reviewed work. This step exists so
        # the REQUIRED `amendment` context is present on the commit, which is what
        # ci_verdict needs to return "green".
        if: github.event_name == 'push'
        run: echo "governance gate enforced at pull-request time; reporting required context on master"
