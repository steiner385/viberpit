name: Agent contract

on:
  pull_request:
    paths:
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.github/copilot-instructions.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/agent-contract.yml'
  push:
    branches: [main, master]
    paths:
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.github/copilot-instructions.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'

permissions:
  contents: read

concurrency:
  # Per-commit on master — see the long note in ci.yml: a shared master group lets a
  # merge burst cancel the middle commits' runs while they are still pending, leaving
  # those shas with no check-runs.
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .agents/agentctl.py check .
