name: Server test shard
description: >-
  Install the server package and run one shard of server/tests/ on a given Python.
  THE step list for both ci.yml server-test jobs: the required 3.12 `server-tests`
  matrix and the non-required `server-tests-py314` one, so the two cannot drift apart.
  The caller checks the repo out first. Postgres is the runner's own preinstalled
  server, started here, not a service container: anonymous image pulls from shared
  runner IPs hit `toomanyrequests` and failed shards before a single step ran.

inputs:
  python-version:
    description: Python version for actions/setup-python.
    required: true
  shard:
    description: This shard's 1-based index.
    required: true
  total:
    description: >-
      Number of shards. Callers pass the `strategy.job-total` expression, never a literal: a
      matrix and a hand-written count that disagree run only part of the suite and
      still report green (tests/test_ci_shard_tests.py enforces this).
    required: true
  artifact-name:
    description: Name of the uploaded junit artifact (unique per job and shard).
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install deps
      shell: bash
      run: pip install -e ".[server]"
    - name: Start Postgres
      # GitHub's Ubuntu runners ship PostgreSQL installed but stopped. Starting it
      # replaces the postgres:16 service container, whose anonymous pull from
      # public.ecr.aws ("toomanyrequests: Data limit exceeded") failed whole shards
      # at "Initialize containers". The role is a SUPERUSER, as the container's
      # POSTGRES_USER was: a throwaway CI database, same privileges as before.
      shell: bash
      run: |
        sudo systemctl start postgresql.service
        for _ in $(seq 1 30); do
          pg_isready -h 127.0.0.1 -p 5432 -q && break
          sleep 1
        done
        pg_isready -h 127.0.0.1 -p 5432
        sudo -u postgres psql -v ON_ERROR_STOP=1 -q \
          -c "CREATE ROLE viberpit_test LOGIN SUPERUSER PASSWORD 'test';" \
          -c "CREATE DATABASE viberpit_test OWNER viberpit_test;"
        psql "postgresql://viberpit_test:test@127.0.0.1:5432/viberpit_test" -tAc "select version();"
    - name: CPU diagnostics
      # Confirms the 2-worker hypothesis in #1137 on the record, per its
      # suggested first step, each time this job runs.
      shell: bash
      run: |
        echo "nproc: $(nproc)"
        python -c "import os, sys; print('os.cpu_count():', os.cpu_count(), '| python', sys.version.split()[0])"
    - name: Server tests (shard ${{ inputs.shard }}/${{ inputs.total }}, Python ${{ inputs.python-version }})
      shell: bash
      env:
        VIBERPIT_TEST_PG_URL: postgresql+asyncpg://viberpit_test:test@127.0.0.1:5432/viberpit_test
        PY: ${{ inputs.python-version }}
        SHARD: ${{ inputs.shard }}
        TOTAL: ${{ inputs.total }}
      # scripts/ci_shard_tests.py buckets whole FILES (never individual
      # tests) by a hash of their path, so --dist loadfile's per-file worker
      # pinning still holds — files that share DB/Postgres state (e.g.
      # test_postgres_compat) stay serialized, now within one shard job
      # instead of within the single runner. pytest-timeout converts a hung
      # test into a NAMED failure after 300s (a bad shuffle once ate the
      # whole job budget silently and held up the deploy controller); the
      # outer `timeout` guard is the backstop.
      run: |
        set -uo pipefail
        files="$(python scripts/ci_shard_tests.py --shard "$SHARD" --total "$TOTAL")"
        echo "Shard $SHARD/$TOTAL: $files"
        # `shell: bash` runs this as `bash -eo pipefail`, so a bare failing pipeline
        # would exit right here, before the job summary below is written. `|| rc=$?`
        # captures pytest's (pipefail) status without tripping -e.
        rc=0
        # $files is a space-separated list of repo-relative paths (no spaces in
        # path names) and must word-split into separate pytest args.
        # shellcheck disable=SC2086
        timeout --signal=SIGTERM 1500 python -m pytest $files -q -rf -n auto --dist loadfile \
          --timeout=300 --junitxml="test-results/server-shard-$SHARD.xml" 2>&1 | tee pytest.log || rc=$?
        if [ "$rc" -ne 0 ]; then
          # The failing tests, on the run's summary page: no digging through a
          # 15k-line log to learn which test broke a shard.
          failed="$(grep -E '^(FAILED|ERROR) ' pytest.log || true)"
          {
            echo "### Python $PY, shard $SHARD/$TOTAL: pytest exited $rc"
            echo
            echo '```'
            if [ -n "$failed" ]; then echo "$failed"; else tail -n 40 pytest.log; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$rc"
    - name: Upload test results
      # !cancelled() so a FAILING run still uploads its junit — but not a cancelled
      # one, whose killed reporter leaves a truncated/0-byte report (#1768).
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: test-results/*.xml
        retention-days: 30
