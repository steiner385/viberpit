# Legacy-brand ratchet registry — read by scripts/brand_ratchet.py, enforced by
# server/tests/test_brand_ratchet.py inside the lint-and-test gate.
#
# Every remaining `ccswitch` / `cc-account-switcher` spelling in the tree must be
# CLAIMED by exactly one [[allow]] entry below. An unclaimed spelling fails the gate:
# rename it, or — if it cannot be renamed by search-and-replace (a wire contract, a
# persisted key, host state, the Python package) — file a GitHub issue and add an
# entry pointing at it. Entries that keep the old spelling on purpose say why in
# `permanent` and cite the design decision.
#
# Entries are tried IN ORDER; the first one whose `paths` glob (if any) matches the
# file and whose `pattern` (if any) overlaps the spelling claims it. `ceiling` is the
# count when the entry was last tightened: a category that grows past it fails, one
# that shrinks passes and asks you to run `python scripts/brand_ratchet.py --update`.
#
# The rebrand plan: docs/superpowers/specs/2026-09-06-viberpit-rebrand-design.md
# The guide:        docs/product/guides/viberpit-rebrand.md

[scan]
needles = ["ccswitch", "cc-account-switcher", "cc_account_switcher"]
# Historical records and recorded artifacts: rewriting them is churn, not progress
# (design §1 "Deliberately not renamed", decision D5).
exclude = [
  "docs/superpowers/",
  "docs/audits/",
  "docs/2026-",
  "specs/",
  "docs/sdlc/",
  ".superpowers/",
  "server/tests/fixtures/",
  ".brand-ratchet.toml",
]

# ── Permanent: the spelling is the point ───────────────────────────────────────

[[allow]]
id = "brand-module"
paths = ["src/viberpit/brand.py", "web/src/brand.ts"]
permanent = "The LEGACY_* constants are the one place the old spelling may be defined (design §1)."
# 5th: web/src/brand.ts REPO_NAMESPACES, the web mirror of brand.REPO_NAMESPACES (#1373).
ceiling = 5

[[allow]]
id = "wire-dual-accept"
pattern = '<!--\s*ccswitch:|</?ccswitch-context|mcp__ccswitch__|\bccswitch:(complete|no-pr|model|hand-back)\b'
permanent = "Markers, context headers and MCP tool names live in stored transcripts that are re-parsed on replay; the accept side never comes out (design Phase 7 'keep forever')."
ceiling = 48

[[allow]]
id = "rebrand-narrative"
paths = ["docs/product/guides/viberpit-rebrand.md", "README.md", ".brand-ratchet.toml", "scripts/brand_ratchet.py", "server/tests/test_brand_*.py", "tests/test_brand.py", "web/src/brand.test.ts"]
permanent = "Text that names the old brand in order to explain the rename (the migration guide, README's 'formerly' line, the ratchet and its tests)."
ceiling = 51

[[allow]]
id = "ratchet-rule"
pattern = '`ccswitch` spelling not claimed'
permanent = "The contributor rule in core.md / AGENTS.md has to say which spelling the ratchet hunts."
ceiling = 2

[[allow]]
id = "export-format-id"
pattern = 'ccswitch\.normalized-events|ccswitchExportMeta'
permanent = "Phase 2b (#1368) flipped the emitted id to `viberpit.normalized-events/v1`; the accept side keeps both forever, because an exported `.jsonl` already on someone's disk can never be rewritten — the same reason the marker parsers stay. All that is left is the test that pins what actually shipped, so the derived `brand.LEGACY_SLUG` constant cannot drift off the real historical value."
ceiling = 1

[[allow]]
id = "not-renamed"
pattern = '\bccswitch-auth\b|/var/lib/ccswitch-codex-auth|/opt/ccswitch-codex-auth|/state/ccswitch/codex|"ccswitch" / "codex"|CN=ccswitch|\bccswitch-ca\b|001-ccswitch-web|asyncpg://ccswitch:|@[^ `]*/ccswitch\b|PG_(ROLE|DB):-ccswitch|^\s*ccswitch:<password>@|>/ccswitch\b|`ccswitch`, and grants|\bhost\s+ccswitch\s+ccswitch\b|-U ccswitch\b|-d ccswitch\b|`ccswitch`( Postgres)? (role|database)|(role|db|database) `ccswitch`|ccswitch (role|database)\b|ccswitch-assistant(-user)?-v1'
permanent = "Not the brand: the unix user and 0700 state dir holding OpenAI refresh tokens (rename at the next credential rotation), the mTLS CA CN (next rotation), the Postgres role/db name (D6), the spec directory `.specify/feature.json` points at, and the versioned HMAC salts of the assistant token, which sit beside the `ccas1:` wire prefix (design §1 table)."
ceiling = 124

# ── Tracked: each category has the issue that removes it ───────────────────────

[[allow]]
id = "http-auth-compat"
# Phase 2b landed: the cookie and both attribution headers now EMIT the new
# spelling. What is left is the accept side — the two legacy header names in
# `auth/middleware.py`, plus the test that pins the cookie's historical spelling
# so the derived `brand.LEGACY_SLUG` constant cannot drift off it. Retires with
# the rest of #1368's compat window.
pattern = '\bccswitch_session\b|X-CCSwitch-|x-ccswitch-'
issue = 1368
ceiling = 3

[[allow]]
id = "browser-storage-keys"
# Phase 2b landed: every key is written as `viberpit.<name>` and readers migrate
# the old one forward (`lib/storageKey.ts:migrateStorageNamespace`). What is left
# is the compat half — the legacy namespace, the pre-namespace colon keys, and the
# tests that pin the migration — which retires when the read side does.
paths = ["web/*", "web/**/*"]
pattern = "['\"`]ccswitch\\.|ccswitch\\.\\$\\{|ccswitch:(draft|auto-reloaded)|STORAGE_NAMESPACE = 'ccswitch'|toBe\\('ccswitch'\\)"
issue = 1368
ceiling = 25

[[allow]]
id = "persisted-keys"
# Phase 2c landed (#1369): no emitter spells a dedupe key with the old slug any more
# (they are composed from the product's CURRENT slug), and `0061_brand_automation_keys`
# converges rows written before the product was renamed. What is left is ONE key that
# Phase 2c did not cover: the `ccswitch-pr-cycle-time` control band in
# `server/sdlc/bands.yaml`, whose id is referenced by stored ControlBandBreach rows and
# so needs its own migration. Re-pointed at the epic, since #1369 is closed.
pattern = '\bccswitch:[a-z][a-z-]*|feature-map-ccswitch|ccswitch-pr-cycle-time'
issue = 1365
ceiling = 4

[[allow]]
id = "branch-prefix"
# Phase 2c landed (#1369): `viberpit/<base>-<id>` is what gets created, and
# `brand.is_session_branch` matches BOTH spellings — permanently, because a pushed
# branch is not ours to rewrite and `git branch -D` is the only thing that ever
# deletes one. The residual count is NOT branch prefixes: this entry is tried before
# `repo-namespace`, `host-legacy-names` and `python-package`, so it also claims every
# `.ccswitch/`, `/etc/ccswitch/` and `src/ccswitch/` path they own. Those shrink under
# #1373 / #1592 / #1374; re-pointed at the epic, since #1369 is closed.
pattern = '\bccswitch/'
issue = 1365
ceiling = 119

[[allow]]
id = "repo-namespace"
pattern = '\.ccswitch(?![A-Za-z_])|\.ccswitch-codex-attachments'
issue = 1373
ceiling = 34

[[allow]]
# #1591 renamed every CCSWITCH_* read/write to VIBERPIT_* except the Phase 0b
# mirror infrastructure itself (env_compat.py + its tests) and the handful of
# call sites that legitimately run BEFORE that mirror can fill the other
# prefix in: the shell fallback idiom (`${VIBERPIT_X:-${CCSWITCH_X:-default}}`,
# scripts/deploy read env directly, no Python mirror in the loop) and
# server/tests/conftest.py's production-isolation guard (runs at collection,
# before `import server` has ever run the mirror). These must keep both
# spellings until Phase 7 retires the mirror (design §3).
id = "env-prefix-mirror"
pattern = '\bCCSWITCH_[A-Z0-9_]*'
paths = [
  "src/viberpit/env_compat.py",
  "tests/test_env_compat.py",
  "server/tests/test_env_mirror_entrypoints.py",
  "server/tests/conftest.py",
  "scripts/viberpit-health-check.sh", "scripts/ccswitch-health-check.sh",
  "scripts/viberpit-mint-mtls.sh", "scripts/ccswitch-mint-mtls.sh",
  "scripts/viberpit-pg-provision.sh", "scripts/ccswitch-pg-provision.sh",
  "deploy/bin-viberpit-mounts.sh", "deploy/bin-ccswitch-mounts.sh",
  ".env.example",
  "server/tests/test_pm_map_changes_api.py",
  "server/tests/test_production_db_isolation.py",
  "scripts/smoke_codex_interactive.py",
  "server/tests/test_smoke_codex_safety.py",
]
permanent = "Phase 0b env-prefix mirror must reference both spellings until Phase 7 retires it (design §3)."
ceiling = 132

[[allow]]
id = "host-legacy-aliases"
paths = ["deploy/ccswitch*", "deploy/bin-ccswitch-mounts.sh", "scripts/ccswitch-*", "scripts/viberpit-host-aliases.py", "scripts/viberpit-host-cutover.py", "tests/test_host_aliases.py", "tests/test_host_cutover.py", "docs/runbooks/viberpit-host-cutover.md"]
issue = 1592
ceiling = 172

[[allow]]
id = "host-legacy-names"
pattern = 'ccswitch-(daemon|deploy|health|mounts|cert-renew|codex-auth|tailnet|controller|deploy-controller|health-check)[A-Za-z0-9.@-]*|\bccswitch\.service|/(etc|run|var/lib|var/log|srv)/ccswitch|\.(cache|local/lib)/ccswitch|"\.cache" / "ccswitch"|bin-ccswitch|ccswitch-archives|cc-account-switcher-deploy|\bccswitch\.env\b|\bccswitch\.(db|jsonl|local)\b|/home/tony/GitHub/ccswitch|"service", "ccswitch"|service ccswitch|ccswitch (master key|oauth token)'
issue = 1592
ceiling = 290

[[allow]]
id = "python-package"
pattern = '\b(from|import)\s+ccswitch\b|\bccswitch\.[a-z_]+|src/ccswitch\b|src\.ccswitch|__editable__\.ccswitch|name = "ccswitch"|^ccswitch = "|\bccswitch-0\.1\.0|(\.venv/)?bin/ccswitch|version\("ccswitch"\)|ccswitch\[server\]|\bccswitch (accounts|clones|add|crypto|init|link|lint|list|migrate|remove|show|status|use|mcp|ask)\b|\b_?ccswitch_[a-z_]+\b|`ccswitch`\s+(CLI|binary|command|console|entry|proper|package)|(CLI|binary|command|script|entry point|installed as|console script|package)\s+`ccswitch`|--prog ccswitch|prog="ccswitch"|"command": "ccswitch"|Entry points: the `ccswitch` command|logger="ccswitch"|getLogger\("ccswitch"\)'
issue = 1374
# #2166 adds the `lint` subcommand (`ccswitch lint feature-docs`, invoked from
# the reusable workflow) to the subcommand alternation, plus its
# tests/test_cli.py::TestLintCommands test needs its own `from ccswitch import
# cli` like every other test class in that file — the package name is not
# renameable (this category's own reason for existing).
# #1374 (Phase 5a) renamed the real package src/ccswitch/ -> src/viberpit/ and
# rewrote every live import to match, which is most of what this ceiling used
# to carry. What is left: the kept `ccswitch` console-script alias, plus the
# permanent `patch("ccswitch.<mod>...")` / `__import__("ccswitch.<mod>", ...)`
# strings that the compat shim's meta_path finder resolves to the identical
# `viberpit.<mod>` module object either name is imported under, and the
# handful of literal-string survivors the pattern above already names.
ceiling = 342

[[allow]]
id = "python-package-shim"
paths = ["src/ccswitch/__init__.py"]
issue = 1374
# Phase 5a (#1374) moved the real package to src/viberpit/ and left this thin
# compat package in its place: a sys.meta_path finder aliasing `ccswitch.*` to
# the identical `viberpit.*` module object for one release. Its own docstring
# and comments have to spell the legacy name to say what it aliases — the
# `python-package` pattern above deliberately does not chase RST double-backtick
# prose, so this file gets its own path-scoped entry instead of widening that
# pattern for everyone. Retires with the rest of the shim.
ceiling = 5

[[allow]]
id = "constitution"
paths = [".specify/memory/constitution.md"]
issue = 1377
ceiling = 2

[[allow]]
# The three env vars the prod-deploy gate reads. The hook is a `GUARDRAIL_PATHS`
# file (server/sdlc/governance.py): any diff to it fails the `amendment` CI check
# without an "Owner acknowledgment:" line, which an agent must not write for
# itself (#1377 "Owner-only"). So #1591 could not rename these, and the two
# companions have to hold the same spelling or they would be wrong rather than
# stale — `.claude/README.md` documents which names the hook reads, and the test
# passes them to the real hook as a subprocess. Renaming all three is one
# owner-acknowledged diff; until then they move together or not at all.
#
# Note the hook cannot lean on the Phase 0b mirror the way `env-prefix-mirror`
# call sites do: Claude Code spawns it as a bare `python3` script that never
# imports `ccswitch`, so no mirror ever runs in its process.
id = "guardrail-env-prefix"
pattern = '\bCCSWITCH_[A-Z0-9_]*'
paths = [
  ".claude/hooks/prod-deploy-gate.py",
  ".claude/README.md",
  "server/tests/test_sdlc_governance_config.py",
]
issue = 1377
ceiling = 11
